name: Deploy (self-hosted)

# CI/CD: on every push to main, the self-hosted runner on the deploy host pulls
# the latest code and rebuilds/restarts the Docker stack. No image registry
# needed — the image is built locally on the host.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: forma-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, forma]
    steps:
      - name: Pull latest and redeploy
        env:
          # Persistent working copy on the host — holds the gitignored .env with
          # secrets. Change here if the checkout ever moves.
          DEPLOY_DIR: /Users/kristampswang/Desktop/forma-offline
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          cd "$DEPLOY_DIR"
          git fetch --all --prune
          git reset --hard origin/main
          docker compose up -d --build
          docker image prune -f
